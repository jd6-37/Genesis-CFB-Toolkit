<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // The Mod Toolkit and Dynasty used to live on this address (/#rosters, /#dynasty/team/12):
      // send those links to the apps' own addresses before anything loads.
      (function () {
        var h = location.hash;
        if (location.pathname !== '/' || !h) return;
        if (/^#dynasty(\/|$)/.test(h)) location.replace('/dynasty' + (h.length > 9 ? '#' + h.slice(9) : ''));
        else if (/^#(patch|swap|season|teams|rosters|styles)$/.test(h)) location.replace('/toolkit' + h);
      })();
    </script>
    <!--head-->
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f0c45" />
    <meta name="apple-mobile-web-app-title" content="BW95 Elevated" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
