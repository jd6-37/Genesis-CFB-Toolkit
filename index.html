<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // The Mod Toolkit and Dynasty used to live on this address (/#rosters, /#dynasty/team/12):
      // send those links to the apps' own addresses before anything loads.
      (function () {
        var h = location.hash;
        if (location.pathname !== '/' || !h) return;
        if (/^#dynasty(\/|$)/.test(h)) location.replace('/dynasty' + (h.length > 9 ? '#' + h.slice(9) : ''));
        else if (/^#(patch|swap|season|teams|rosters|styles)$/.test(h)) location.replace('/toolkit' + h);
      })();
    </script>
    <!--head-->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2323208a'/%3E%3Cpath d='M3 11c0-4 2-7 5-7s5 3 5 7H3z' fill='%23f6d84a'/%3E%3Crect x='9' y='9' width='5' height='2' fill='%23f2f0ff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/site/main.tsx"></script>
  </body>
</html>
